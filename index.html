<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Regional Coordinator – KPK</title>
<meta name="description" content="Ask the AI Regional Coordinator – KPK about approvals, processes, information and L&D.">
<meta name="theme-color" content="#FFFFFF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AI RC KPK">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&family=Figtree:wght@400;500;600&display=swap">
<script>
  /* ===== PASTE YOUR GOOGLE WEB APP LINK BELOW (it ends with /exec) ===== */
  var APP_URL = 'https://script.google.com/macros/s/AKfycbwR13G1dha9XfO0u9g9QfRb2pVMk-J7wnDOdEUr-DSdo0K_04_s-PWUy79EfRH3e3AF/exec';
</script>
<style>
  :root{--bg:#F4F7FB;--ink:#0B1F4D;--muted:#64728C;--grad:linear-gradient(135deg,#16B2E0 0%,#2563EB 100%);color-scheme:light}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:#fff}
  body{font:15px/1.5 "Figtree","Segoe UI",system-ui,sans-serif;color:var(--ink);padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
  iframe{display:block;width:100%;height:100%;border:0}
  .splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#fff;transition:opacity .35s;padding:24px;text-align:center}
  .splash.gone{opacity:0;pointer-events:none}
  .splash img{width:120px;height:120px;border-radius:50%}
  .splash h1{font:700 1.35rem/1.2 "Outfit","Segoe UI",sans-serif;margin:0}
  .splash p{margin:0;color:var(--muted);font-size:.9rem}
  .loader{width:120px;height:4px;border-radius:99px;background:#E8EEF6;overflow:hidden}
  .loader i{display:block;height:100%;width:40%;background:var(--grad);border-radius:99px;animation:slide 1.1s infinite ease-in-out}
  @keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
  @media (prefers-reduced-motion:reduce){.loader i{animation:none;width:100%}}
  .install{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #E2E8F1;border-radius:14px;padding:10px 12px 10px 14px;box-shadow:0 6px 24px rgba(11,31,77,.14);font-size:.88rem;max-width:calc(100% - 32px);z-index:5}
  .install button{border:0;border-radius:10px;padding:8px 14px;font-family:inherit;font-weight:600;font-size:.85rem;cursor:pointer}
  .install .go{background:var(--grad);color:#fff}
  .install .x{background:none;color:var(--muted);padding:8px}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="splash" id="splash">
  <img src="icon-512.png" alt="">
  <h1>AI Regional Coordinator</h1>
  <p id="sub">KPK Region</p>
  <div class="loader" id="loader"><i></i></div>
</div>
<div class="install" id="install" hidden>
  <span id="installText">Install the app on your phone</span>
  <button class="go" id="installGo" type="button">Install</button>
  <button class="x" id="installX" type="button" aria-label="Dismiss">✕</button>
</div>

<script>
(function(){
  var splash=document.getElementById('splash');
  if(!/^https:\/\/script\.google\.com\/.+\/exec$/.test(APP_URL)){
    document.getElementById('sub').textContent='Setup needed: paste your Google web app link into index.html (APP_URL).';
    document.getElementById('loader').hidden=true;return;
  }
  var inbox=/inbox/i.test(location.search+location.hash);
  var f=document.createElement('iframe');
  f.src=APP_URL+(inbox?'?page=inbox':'');
  f.title=inbox?'RC Inbox':'AI Regional Coordinator';
  f.allow='clipboard-write';
  f.addEventListener('load',function(){setTimeout(function(){splash.classList.add('gone')},250)});
  document.body.insertBefore(f,splash);
  setTimeout(function(){splash.classList.add('gone')},12000);
  if(inbox)document.title='RC Inbox';
})();

// Install prompt
(function(){
  var standalone=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone;
  var box=document.getElementById('install'),deferred=null,dismissed=false;
  try{dismissed=localStorage.getItem('aircInstallDismissed')==='1'}catch(e){}
  if(standalone||dismissed)return;
  window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferred=e;setTimeout(function(){box.hidden=false},2500)});
  var ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  if(ios){document.getElementById('installText').textContent='Install: tap Share, then "Add to Home Screen"';document.getElementById('installGo').hidden=true;setTimeout(function(){box.hidden=false},2500)}
  document.getElementById('installGo').addEventListener('click',function(){if(!deferred)return;deferred.prompt();deferred.userChoice.finally(function(){box.hidden=true;deferred=null})});
  document.getElementById('installX').addEventListener('click',function(){box.hidden=true;try{localStorage.setItem('aircInstallDismissed','1')}catch(e){}});
})();

if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
</script>
</body>
</html>
